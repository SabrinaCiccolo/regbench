[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regbench"
version = "0.1.0"
description = "Point-cloud registration benchmark under part symmetry, clutter and template-difference inspection"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "open3d==0.19.0",
    "tifffile",
    "scikit-learn",
]

[project.scripts]
regbench = "regbench.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regbench = ["config.yaml"]
